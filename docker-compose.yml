version: "3.8"

services:
  latent-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: latent-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=latent-production-super-secret-key-change-in-prod-2026
      - DATABASE_URL=sqlite:////app/latent.db

    volumes:
      - app-data:/app/frontend/uploads
      - db-data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app-data:
  db-data:
